apiVersion: v1
kind: Service
metadata:
  name: multi-container-svc
  labels:
    app: multi-container
spec:
  type: ClusterIP
  selector:
    app: multi-container
  ports:
  - name: nginx
    protocol: TCP
    port: 9001
    targetPort: 80
  - name: multitool
    protocol: TCP
    port: 9002
    targetPort: 8080
