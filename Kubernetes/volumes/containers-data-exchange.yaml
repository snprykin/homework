apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange
  labels:
    app: data-exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange
  template:
    metadata:
      labels:
        app: data-exchange
    spec:
      containers:
      - name: writer
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          while true; do
            echo "$(date) - Data from writer" >> /shared/output.log
            sleep 5
          done
        volumeMounts:
        - name: shared-data
          mountPath: /shared

      - name: reader
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          tail -f /shared/output.log
        volumeMounts:
        - name: shared-data
          mountPath: /shared

      volumes:
      - name: shared-data
        emptyDir: {}
