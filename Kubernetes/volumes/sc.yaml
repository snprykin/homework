---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sc-pvc
spec:
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-storage

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-sc
  labels:
    app: data-exchange-sc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-sc
  template:
    metadata:
      labels:
        app: data-exchange-sc
    spec:
      containers:
      - name: writer
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          while true; do
            echo "$(date) - Data from SC writer" >> /shared/output.log
            sleep 5
          done
        volumeMounts:
        - name: sc-data
          mountPath: /shared

      - name: reader
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          tail -f /shared/output.log
        volumeMounts:
        - name: sc-data
          mountPath: /shared

      volumes:
      - name: sc-data
        persistentVolumeClaim:
          claimName: sc-pvc
