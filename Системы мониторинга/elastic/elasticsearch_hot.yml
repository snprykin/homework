# elasticsearch/hot/elasticsearch.yml
cluster.name: "prod-logging-cluster"
node.name: "hot-node-01"
node.attr.data_tier: hot
path.data: /usr/share/elasticsearch/data
path.logs: /usr/share/elasticsearch/logs
network.host: 0.0.0.0
http.port: 9200
transport.port: 9300
discovery.seed_hosts: ["elasticsearch-hot", "elasticsearch-warm"]
cluster.initial_master_nodes: ["hot-node-01", "warm-node-01"]
# Для продакшена здесь должен быть xpack.security.enabled: true, но для ДЗ опустим
