services:
  # ============================================
  # Elasticsearch Hot Node
  # ============================================
  elasticsearch-hot:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch-hot
    environment:
      - node.name=hot-node-01
      - cluster.name=prod-logging-cluster
      - discovery.seed_hosts=elasticsearch-warm
      - cluster.initial_master_nodes=hot-node-01
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - node.attr.data_tier=hot
      - xpack.security.enabled=false
      - bootstrap.memory_lock=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - hot_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - elastic-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ============================================
  # Elasticsearch Warm Node
  # ============================================
  elasticsearch-warm:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch-warm
    environment:
      - node.name=warm-node-01
      - cluster.name=prod-logging-cluster
      - discovery.seed_hosts=elasticsearch-hot
      - cluster.initial_master_nodes=hot-node-01
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - node.attr.data_tier=warm
      - xpack.security.enabled=false
      - bootstrap.memory_lock=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - warm_data:/usr/share/elasticsearch/data
    ports:
      - "9201:9200"
      - "9301:9300"
    networks:
      - elastic-net
    depends_on:
      elasticsearch-hot:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # Kibana 
  # ============================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch-hot:9200
      - XPACK_SECURITY_ENABLED=false
      - ELASTICSEARCH_REQUEST_TIMEOUT=90000
    ports:
      - "5601:5601"
    networks:
      - elastic-net
    depends_on:
      elasticsearch-hot:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # Logstash 
  # ============================================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: logstash
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - XPACK_MONITORING_ENABLED=false
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5044:5044"
      - "5000:5000"
    networks:
      - elastic-net
    depends_on:
      elasticsearch-hot:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # Filebeat 
  # ============================================
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: filebeat
    user: root
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./filebeat/config/filebeat.yml:/usr/share/filebeat/filebeat.yml
    networks:
      - elastic-net
    depends_on:
      elasticsearch-hot:
        condition: service_healthy
    command: ["filebeat", "-e", "--strict.perms=false"]
    restart: unless-stopped

  # ============================================
  # Dummy приложение
  # ============================================
  dummy-logger:
    image: alpine:latest
    container_name: dummy-logger
    command: >
      sh -c '
      while true; do
        echo "{\"timestamp\":\"$$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"INFO\",\"message\":\"Test log entry $$(shuf -i 1-1000 -n 1)\",\"service\":\"dummy-app\"}";
        sleep $$(shuf -i 1-5 -n 1);
      done'
    networks:
      - elastic-net
    restart: unless-stopped

volumes:
  hot_data:
    driver: local
  warm_data:
    driver: local

networks:
  elastic-net:
    driver: bridge
